stages:
  prepare:
    cmd: python -m medimg.data.prepare_rsna
    deps:
      - src/medimg/data/prepare_rsna.py
      - src/medimg/data/dicom.py
      - data/raw/rsna
    params:
      - seed
      - data
    outs:
      - data/processed/rsna
    metrics:
      - reports/data_summary.json:
          cache: false

  train_cls:
    cmd: python -m medimg.train_cls
    deps:
      - src/medimg/train_cls.py
      - src/medimg/models/classifier.py
      - src/medimg/data/dataset.py
      - data/processed/rsna
    params:
      - seed
      - classifier
    outs:
      - models/classifier.pt
    metrics:
      - reports/train_metrics.json:
          cache: false
    plots:
      - reports/train_history.csv:
          x: epoch
          y: val_auroc
          cache: false

  eval_cls:
    cmd: python -m medimg.evaluate_cls
    deps:
      - src/medimg/evaluate_cls.py
      - src/medimg/eval/stats.py
      - src/medimg/explain/gradcam.py
      - models/classifier.pt
      - data/processed/rsna
    params:
      - eval
    outs:
      - models/calibration.json
      - reports/figures:
          cache: false
    metrics:
      - reports/metrics.json:
          cache: false
    plots:
      - reports/subgroups.csv:
          cache: false

  train_seg:
    cmd: python -m medimg.seg.train_seg
    deps:
      - src/medimg/seg/train_seg.py
    params:
      - seed
      - segmentation
    outs:
      - models/seg_unet3d.pt
      - models/seg_last.pt:   # final epoch (reported) and resume state
          persist: true
    metrics:
      - reports/seg_metrics.json:
          cache: false
    plots:
      - reports/seg_history.csv:
          x: epoch
          y: val_dice
          cache: false

  seg_figures:
    cmd: python -m medimg.seg.figures_seg
    deps:
      - src/medimg/seg/figures_seg.py
      - models/seg_last.pt
      - reports/seg_history.csv
    outs:
      - reports/seg_figures/seg_learning_curve.png:
          cache: false
      - reports/seg_figures/seg_examples.png:
          cache: false
    metrics:
      - reports/seg_postproc.json:
          cache: false
    plots:
      - reports/seg_per_case.csv:
          x: case
          y: dice
          cache: false

  seg_cv:   # headline spleen number: every CT scored once, no checkpoint selection (run on Kaggle: kaggle_push.py --seg-cv)
    cmd: python -m medimg.seg.cv_seg
    deps:
      - src/medimg/seg/cv_seg.py
      - src/medimg/seg/train_seg.py
    params:
      - seed
      - segmentation
      - segmentation_cv
    outs:
      - models/seg_cv_fold0.pt:
          persist: true
      - models/seg_cv_fold1.pt:
          persist: true
      - models/seg_cv_fold2.pt:
          persist: true
      - models/seg_cv_fold3.pt:
          persist: true
      - models/seg_cv_fold4.pt:
          persist: true
      - reports/seg_cv_per_case.csv:
          cache: false
    metrics:
      - reports/seg_cv.json:
          cache: false

  seg_cv_figures:
    cmd: python -m medimg.seg.figures_cv
    deps:
      - src/medimg/seg/figures_cv.py
      - reports/seg_cv_per_case.csv
      - reports/seg_cv.json
    outs:
      - reports/seg_figures/seg_cv_per_case.png:
          cache: false
      - reports/seg_figures/seg_cv_failures.png:
          cache: false
