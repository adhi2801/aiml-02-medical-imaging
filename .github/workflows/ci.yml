name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (CPU torch)
        run: |
          uv venv --python 3.12
          # One resolve with the CPU builds pinned: installing monai in a second step let uv swap torch for the
          # PyPI build while torchvision stayed +cpu ("operator torchvision::nms does not exist").
          uv pip install -c constraints-cpu.txt --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match torch torchvision \
            "monai>=1.4" nibabel "pydicom>=3.0" pandas scikit-learn scipy pillow opencv-python-headless \
            matplotlib pyyaml tqdm pytest -r services/inference/requirements.txt -e .
          .venv/bin/python -c "import torch, torchvision; print(torch.__version__, torchvision.__version__)"
      - run: .venv/bin/python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
