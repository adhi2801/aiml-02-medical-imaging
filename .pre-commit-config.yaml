# pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2048]   # weights go to the HF model repo, not git
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: compileall
        name: byte-compile (same as CI)
        entry: python -m compileall -q src scripts tests services space
        language: system
        pass_filenames: false
        types: [python]
